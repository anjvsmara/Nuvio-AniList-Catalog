name: Update AniList catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: nuvio-anilist-kitsu-catalog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build catalog
        run: |
          rm -rf meta
          node scripts/build.js
      - name: Publish generated catalog JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore: update AniList catalog"
            git push
          fi
